name: Automated Discovery and Indexing Engine

on:
  push:
    branches: [ main ]
  schedule:
    # Ejecución automática cada día a las 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  index_and_syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run IndexNow and Distribution Engine
        run: node auto_syndicator.js
